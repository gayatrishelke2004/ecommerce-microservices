apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
      - name: order-service

        image: YOUR_DOCKERHUB_USERNAME/order-service:v1

        ports:
        - containerPort: 5000

        env:
        - name: MYSQL_HOST
          value: mysql-service